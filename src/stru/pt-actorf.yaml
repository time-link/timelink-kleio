- file: {description: Female actors in acts and events PT version, name: pt-actorf.yaml}
- group:
    name: pt-actorf
    description: A portuguese female actor
    source: actorf
    position: [nome, sexo]
    also: [sexo, obs, mesmo_que, xmesmo_que, id]

- group: 
    name: referida
    description: >
        Pessoa referida num acto, não necessariamente presente.
        Estas pessoas não podem incluir eventos pessoais "pevent", 
        para evitar sequências recursivas de pessoa-pevent-pessoa-pevent-...
    source: pt-actorf
    contains: [attribute, relation]

