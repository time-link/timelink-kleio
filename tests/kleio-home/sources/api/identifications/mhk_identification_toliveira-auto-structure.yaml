    idprefix: aut
    name: authority-register
    note: 'An authority register is container for authority records. Authority records
      in Timelink are similar to authory records in library systems. They are used
      to register identification of real entities (people, objects, etc.) and to link
      them.

      Currently the only authority register defined is the "identifications" register,
      which is used to record the real entities (people or objects) that aggregate
      occurrences in the source.

      This is an "abstract" group, meaning that it is not intended to be used directly,
      but rather extended by other groups that define specific authority registers.

      '
    part:
    - authority-record
    position:
    - id
    - name
