    name: fonte
    note: "Este constitui o grupo principal para os documentos\nhistoricos portugueses.
      Admite qualquer dos grupos\nque tenham \"acto\" ou \"evento\" como fonte.\n\nNotas\n\n1.
      Segundo campo posicional\n\nAtualmente o segundo campo posicional, a seguir
      ao \n\"id\" é \"tipo\" (\"registos paroquiais\", \"vereações\", etc). \nFicheiros
      que assumam \"data\" ou \"ano\" necessitam de ser\nmodificados ou usar um ficheiro
      de estrutura alterado \npara correcta interpretação e mapeamento para a base
      de dados.\n\n2. Utilização do campo \"ano\"\n\nO campo \"ano\" deve ser evitado
      uma vez que o campo\n\"data\" permite o registo de datas só com o ano, sem\nnecessidade
      de introdução de zeros para o mês e ano.\n"
