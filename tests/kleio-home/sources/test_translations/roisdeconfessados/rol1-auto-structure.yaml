    idprefix: end
    name: end
    note: "Used to mark the end of the enclosing group. Useful in 2 cenarios:\n\n1)
      To prevent that subsequent groups to be interpreted as subgroups\n   of the
      current group in structures where there is ambiguity.\n\nletter$from x to y/2025-07-26\n
      \   /obs=João reports meeting Joaquim and Maria the day before\n         and
      Joaquim said he met António on 25-6\n    author$João\n    mentioned$Joaquim/obs=described
      yesterday meeting\n        cevent$meeting/2025-06-25\n            mentioned$António\n
      \           end$ends cevent, further mentions\n    mentioned$Maria\n\n2) To
      trigger the processing and exporting of groups in acts with\n   long list of
      groups.\n\nInference rules, that infer relations such as kinship and attributes\nsuch
      as civil status are normally triggered by the end of an act such as\na marriage,
      baptism, or burial.\n\nSome acts or events however contain a large number of
      items that are\nindependent one from the other and do not need to be processed\ntogether.\n\nHousehold
      list (róis de confessados) are an example of this,\nwhere each item is independent
      from the others and inference rules\napply to each household item independently.\n\nBy
      adding an \"end\" group after each household item, the inference rules\nare
      triggered and context information is cleared, so that the next item\ncan be
      processed independently.\n\nExample:\n    end$end of household 3\n"
    position:
    - obs
