      \n\nEste ficheiro de estrutura não define um segundo campo posicional e \nobriga
      que os elementos a seguir a \"id\"\ntenham os elementos explicitamente definidos.
      \   \n\n\n2. Utilização do campo \"ano\"\n\nO campo \"ano\" deve ser evitado
      uma vez que o campo\n\"data\" permite o registo de datas só com o ano, sem\nnecessidade
      de introdução de zeros para o mês e ano.\n"
