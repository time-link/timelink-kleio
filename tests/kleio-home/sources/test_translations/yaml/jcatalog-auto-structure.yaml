    idprefix: his
    name: source
    note: "A specific Jesuit Catalog.\n\nid format:\n  `YYYY-T-PROV-VOL-FOL` where\n
      \   T is one of\n      T1 = type 1\n      T2 = type 2 (secret)\n      T3 = domus
      (no names, just \"houses\")\n      T4 = \"brevis\" the communities with the
      names, no numbers, no assessment\n      T5 = index of type 1\n      T6,T7 =
      suplements to type 1 and type 2,\n              with new entries\n      T8 =
      list of deaths, expulsions, abandons\n      T9 = list of people in missions\n
      \     T10 = list with specific scope\n            e.g. \"lista dos que acabaram
      o curso de Artes no ano de 1565\"\n      T11 = varia\n\n    Add \"P\" to type
      if catalog is partial (e.g. one single comunity)\n  PROV = three letter abreviation
      of province, e.g. LUS for Lusitania\n  VOL = volume (in the collection of the
      specified province)\n  FOL = starting page (fólio)\n\n  Example: 1587-T1-LUS-44I-1\n"
    part:
    - historical-act
    - event
    - text
    position:
    - id
    - year
    - type
    - loc
    - ref
    source: historical-source
