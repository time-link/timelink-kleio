- file:
      name: pt-acts.yaml
      description: |
          Ficheiro com os actos principais para a estrutura de
          documentos historicos portugueses e elementos
          associados a eles
- include: pt-elements.yaml
- include: pt-groups.yaml

# Elementos adicionais em actos
- element: {name: juro, source: string256}
- element: {name: moeda, source: string256}
- element: {name: prazo, source: string256}
- element: {name: valorn, source: number}

# alguns actos registam o nome de pessoas como elementos
- element: {name: depositario, source: name}
- element: {name: juiz, source: name}
- element: {name: escrivao, source: name}
- element: {name: tabeliao, source: name}
- element: {name: celebrante, source: name}
- element: {name: visdor, source: name}


- group:
      name: integr
      arbitrary:
          - referido
          - referida
          - acionista
          - acionistaf
          - ls
          - rel
          - acao
      source: pt-acto
- group:
      name: lcc
      arbitrary:
          - n
      source: pt-acto

# devassas das visitas pastorais

- group:
      name: devassa
      description: >
        Devassas temporais nas visitas pastorais. As devassas
        incluem testemunhas (testo$ e testa$ m/f); as testemunhas
        incluem acusacoes (acus$) de casos (caso$)
      source: pt-acto
      position: [id, dia, mes, ano]
      also: [folio, fol, visdor, obs]
      contains:
          - testo
          - testa
          - referido
          - referida
- group:
    name: acus 
    description: > 
        Acusações em devassas e inquéritos.
        As acusações em devassas são contidas em testemunhas.
        Tem como elementoso id do caso, "origem" "literal"
    source: object
    position: [idcaso, obs] 
    guaranteed: [idcaso]
    also: [literal, origem, obs, id]
    contains: [caso]
- group:
    name: caso
    description: Um caso numa devassa ou inquérito
    source: object
    position: [id, tipo]
    guaranteed: [id, tipo]
    also: [obs]
    contains: [acusado, acusada, referido, referida]
- element: {name: idcaso, source:id}
- element: {name: origem, source: text}
- element: {name: literal, source: text}
#  fim devassas

- group:
      name: denuncia
      source: pt-acto
      arbitrary:
          - denunciante
      description: "Denuncia de um caso como nos cadernos dos promotores da inquisicao "

# Misericórdias
- group:
