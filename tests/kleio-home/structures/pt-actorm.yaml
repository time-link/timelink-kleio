- file:
    name: pt-actorm.yaml
    description: Portuguese male actors

- group:
    name: pt-actor
    description: A portuguese actor, gender set by element
    source: actorm
    position: [nome, sexo]
    guaranteed: [nome, sexo]
    also: [sexo, obs, mesmo_que, xmesmo_que, id]

- group:
    name: pt-actorm
    description: A portuguese male actor
    source: actorm
    position: [nome, sexo]
    also: [sexo, obs, mesmo_que, xmesmo_que, id]

- group:
    name: n
    description: >
        Pessoa genérica ou principal actor de um acto
        (e.g. criança em baptismo).
        Sexo deve registado depois do nome.
    source: pt-actorm
    contains: [kin-m,kin-f,notkin-m,notkin-f]
    position: [nome, sexo]

- group: 
    name: referido
    description: >
        Pessoa referida num acto, não necessariamente presente.
        Estas pessoas não podem incluir eventos pessoais "pevent", 
        para evitar sequências recursivas de pessoa-pevent-pessoa-pevent-...
    source: pt-notkin-m
    contains: [attribute, relation]

