- group: 
    name: referido
    description: >
        Pessoa referida num acto, não necessariamente presente.
        Estas pessoas não podem incluir eventos pessoais "pevent", 
        para evitar sequências recursivas de pessoa-pevent-pessoa-pevent-...
    source: pt-actorm
    contains: [attribute, relation]

