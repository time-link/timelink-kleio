# contém habilitações de genere, com diferentes variantes

-   group:
      name: hab
      description: Habilitacoes da Ordem de Cristo e Santo Oficio
      source: pt-acto
      also:
      -   obs
      contains:
      -   n
      -   referido
      -   referida
      -   test
      guaranteed:
      -   id
      -   cota
      -   data
      idprefix: his
      position:
      -   id
      -   cota
      -   data
      prefix: non
      suffix: non
-   group:
      name: proc
      description: >
        Variante de hab usada por Rosario Castico na Lousa.
        Modifica
      source: hab
      guaranteed:
      -   id
      -   dia
      -   mes
      -   ano
      position:
      -   id
      -   dia
      -   mes
      -   ano
      -   loc
-   group:
      name: po
      description: Variante de "hab" para os processos de ordenação
      source: hab
-   group:
      name: chanc
      description: "Chancelarias \n"
      source: pt-acto
      also: [loc, resumo, obs]
      contains: [n, referido, referida, item]
      guaranteed: [id, dia, mes, ano]
      idprefix: his
      position: [id, dia, mes, ano, loc]
      prefix: non
      suffix: non
