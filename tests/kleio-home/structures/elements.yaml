- file:
    name: elements.yml
    description: |

        ====================================
        Elements used in the Kleio schemas
        ====================================

        This file contain the basic elements used
        in the definition of Kleio schemas (aka structures).

        Using these elements, or specializing them,
        triggers specific behaviours in the processing
        of Kleio data files.

        When defining specific groups with specific
        elements it is important to define new elements
        by specializing the ones bellow, with the "source"
        parameter. This will allow better processing of
        database mappings.

        For instance,

        element:
            name: comment
            source: obs

        To process sources in other languages new elements
        should be defined using the ones bellow as source.

        For instance, in Portuguese

        element:
            name: dia
            source: day

# Basic data types. Usefull to define the type of data field in
#      the destination database.

- element:
    name: number
    description: Any number
- element:
    name: string64
    description: '64 chars strings like those used in ids. Use for elements that contain
      ids of other entities. Use ""id"" for entity own id. '
- element:
    name: string256
    description: Longer strings, like names or short descriptions.
- element:
    name: text
    description: Long texts, like descriptions, summaries, etc.
- element:
    name: control
    description: Element that affect the processing of files, mostly used in "kleio" group and "source"
- element:
        name: json
        description: json data (used internally)
# ================================
# Elements used for dates
# ================================
- element:
    name: day
    description: two digit representation of the day
    source: number
- element:
    name: month
    description: two digit representation of the month
    source: number
- element:
    name: year
    description: four digit representation of the year
    source: number
- element:
    name: date
    description: |
        Date in the format YYYYMMDD or YYYY-MM-DD.
        Also allows ranges like 2021-01-01:2021-01-31
        and relative dates like >2021-01-01

        For more information on date formats see:
          see: https://github.com/time-link/timelink-kleio/issues/1
- element:
    name: date_extra_info
    source: json
    description:
        Used internally to represent complex dates.
# Unique identification elements
# ===========================================
- element:
    name: id
    description: >
        The id of the entity. This element is used to identify
        the entity in the database. It is used to link entities
        in the database. It is a string64 element.
    identification: yes
    source: string64

- element:
    name: same_as
    description: >
        This element is used to link occurrences of the same entity
        in the same file. At the end of processing it is checked if
        the destination entity exists in the sames file. If not an
        error is raised.
    source: id

- element:
    name: xsame_as
    description: |
        This element is used to link occurrences of the same entity
        in diferent files.
    source: id

- element:
    name: entity
    description: Reference to an entity in another entity.
    source: id

- element:
    name: origin
    description: id of the origin of a relation
    source: id

- element:
    name: destination
    description: id of the destination of a relation
    source: id

# Standard elements used in the Kleio schemas
# ===========================================

- element:
    name: type
    description: The type of an attribute, relation, act or other entity.
    source: string256
- element:
    name: value
    description: The value of an attribute or relation
    source: text
- element:
    name: class
    description: The class of an entity (e.g. person, object)
    source: string64
- element:
    name: loc
    description: >
        Location (place) of an entity or act.
        Sometimes in sources it is used to register the location
        of the source (archive, library, etc).
    source: string256

#  People and objects
- element:
    name: name
    description: name, normally of a person
    source: string256
- element:
    name: description
    description: Similar to name, but for objects or events
    source: string256
- element:
    name: destname
    description: Name of destination in a relation
    source: string256
- element:
    name: sname
    description: >
        Standard name of an entity, used to register the name
        of an entity in a standard way. Used in real entities to
        register the canonical name when name of occurences vary.
    source: name

- element:
    name: sex
    description: Gender of a person
    source: string64ma

#  elements for longer texts
- element:
    name: obs
    description: observations, comments, notes, etc. Use triplas aspas for long multi line texts
    source: text
- element:
    name: summary
    description: Summary of a document, use triplas aspas for long multi line texts
    source: text

# Elements used for registering the origin of information in sources
# ==================================================================

- element:
    name: ref
    description: >
        Call number of any reference to document in archive
        or libraries.
    source: string256

- element:
    name: page
    description: Page in document
    source: string64
- element:
    name: pages
    description: page range
    source: string64
- element:
    name: title
    source: text
    description: Title of a work (e.g. a book)

# Elements related to the processing of files
# ===========================================
- element:
    name: replaces
    description: >
        Register id of an entity that should be replaced by the
        entity with this element. Currently used in sources to replace
        earlier version of the same source under a diferent id.
    source: id

- element:
    name: replace
    source: replaces

- element:
    name: subs
    source: replace

- element:
     name: autorels
     source: control
     description: >
        determines the mode of generation of
        automatic relations. Curremtçy unused
- element:
    name: prefix
    description: >
        Prefix all ids in the current file
        with this prefix. Used to avoid duplicate ids
        in different files. Equivalent to the concept
        of namespace.
    source: control

- element:
    name: structure
    description: >
        Path to the structure (schema) to be used.
    source: control

- element:
    name: translations
    description: >
        Number of times this file was translated.
        Used in the generation of automatic ids
        when a file is translated, then edited,
        and new ids need to be generated.
    source: control

- element:
    name: translator
    description: >
        Name of the translator, in the sense of
        a module that takes the source data and
        maps it to a person oriented database.
        Originally to allow diferent target databases
        currently unused.
    source: control

- element:
    name: urlpattern
    description: >
        Patter of a URL in linked data, use "$1" in place of linked id.

    source: string256

- element:
    name: shortname
    description: short pattern of a URL in linked data, used in the link group.

- element:
    name: inside
    description: Id of the entity that contains this entity. automatic
    source: id

# Elements that register the original source text
- element:
    name: groupname
    description: |
        Name of the Kleio group used to register an entity.
        For instance, people are registere under diferent Kleio groups.
        automatic.
    source: string64
- element:
    name: level
    description: Level of nesting of the entity in the source text
    source: number
- element:
    name: line
    description: Line in the source text where the entity is registered
    source: number
- element:
    name: kleiofile
    description: Path of the file where the entity is registered
    source: string256

# Elements associated with authority registers and records
- element: {name: atype, type: string256}
- element: {name: dbase, type: string256}
- element: {name: func, type: string256}
- element: {name: mode, type: string256}
- element: {name: occurrence, type: id}
- element: {name: status, type: string256}
- element: {name: user, type: string256}
