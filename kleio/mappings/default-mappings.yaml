# Default database mappings for Kleio groups.
#
# Ported from src/mappings.pl. Each "mapping" entry maps a Kleio group name
# to a database class. Each "class" entry defines the database table and
# columns for that class, following the schema proposed in
# https://github.com/time-link/timelink-kleio/issues/24.
#
# Attribute fields: name (group element name), column (DB column), baseclass
# (canonical element class), coltype (SQL type), colsize, colprecision, pkey
# (primary-key position; 0 = not a key).

# ============================================
# Group → class mappings
# ============================================
mappings:
  # --- Builtin entity types ---
  - {name: geoentity, class: geoentity}
  - {name: 'historical-source', class: source}
  - {name: 'historical-act', class: act}
  - {name: person, class: person}
  - {name: object, class: object}
  - {name: abstraction, class: object}
  - {name: relation, class: relation}
  - {name: attribute, class: attribute}
  - {name: 'group-element', class: group_element}

  # --- Authority register entities ---
  - {name: 'authority-register', class: aregister}
  - {name: rentity, class: rentity}
  - {name: rperson, class: rperson}
  - {name: robject, class: robject}

  # --- Portuguese-specific source types ---
  - {name: item, class: item}
  - {name: proparr, class: proparr}
  - {name: rmerce, class: 'registo-merces'}
  - {name: acta, class: acta}
  - {name: amz, class: acta}
  - {name: fogo, class: household}
  - {name: escritura, class: escritura}
  - {name: bem, class: good}
  - {name: divida, class: divida}
  - {name: siza, class: siza}
  - {name: aforamento, class: aforamento}
  - {name: escambo, class: escambo}
  - {name: caso, class: caso}
  - {name: acus, class: acusacao}
  - {name: cartaperdao, class: cartaperdao}
  - {name: crime, class: crime}
  - {name: perdao, class: perdao}
  - {name: carta, class: carta}
  - {name: event, class: event}
  - {name: adenda, class: adenda}
  - {name: topico, class: topico}

